<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abrar-Deals</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 5%;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-box {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .logo span {
      color: #22c55e;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-size: 15px;
    }

    .hero {
      background: linear-gradient(135deg, #111827, #2563eb);
      color: white;
      text-align: center;
      padding: 70px 20px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 25px;
    }

    .search-box {
      max-width: 600px;
      margin: auto;
      display: flex;
    }

    .search-box input {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px 0 0 8px;
      font-size: 16px;
      outline: none;
    }

    .search-box button {
      padding: 15px 22px;
      border: none;
      background: #22c55e;
      color: white;
      font-weight: bold;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    .section-title {
      text-align: center;
      font-size: 30px;
      margin-bottom: 25px;
    }

    .categories {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }

    .categories button {
      padding: 10px 18px;
      border: none;
      background: #e5e7eb;
      border-radius: 20px;
      cursor: pointer;
    }

    .categories button:hover {
      background: #22c55e;
      color: white;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
    }

    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }
